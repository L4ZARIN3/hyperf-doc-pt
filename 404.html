<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando…</title>
  <script>
    (function () {
      var path = location.pathname;
      var idx = path.indexOf('/3.2/');
      if (idx !== -1) {
        // Página da documentação: redireciona para o SPA (Docsify) com o caminho preservado
        var base = path.slice(0, idx) + '/3.2/';
        var rest = path.slice(idx + 5);
        location.replace(base + '?p=' + encodeURIComponent('/' + rest));
      } else if (path.charAt(path.length - 1) !== '/' && !/\.[a-z0-9]+$/i.test(path)) {
        // Normaliza barra final (ex.: /hyperf-doc-pt/3.2)
        location.replace(path + '/');
      } else {
        location.replace('/hyperf-doc-pt/');
      }
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=/hyperf-doc-pt/">
  </noscript>
</head>
<body>
  <p>Redirecionando para a <a href="/hyperf-doc-pt/">documentação do Hyperf (pt-BR)</a>…</p>
</body>
</html>
