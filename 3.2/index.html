<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Hyperf 3.2 - Documentação em Português (pt-BR)</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentação do framework Hyperf versão 3.2 em Português Brasileiro (pt-BR), traduzida integralmente da documentação oficial em chinês (zh-cn)." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="stylesheet" href="//unpkg.com/docsify@4/themes/vue.css">
  <style>
    .app-name-link img {
      width: 16%;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script>
    // Captura a base ANTES de qualquer mudança de URL (usada depois na config).
    window.__DOCS_BASE__ = window.location.pathname.replace(/index\.html.*$/, '');
  </script>
  <script src="../vendor/docsify.min.js"></script>
  <script>
    // Consome o parâmetro ?p= usado pelo 404.html do GitHub Pages (SPA fallback)
    // e URLs antigas com hash (ex.: #/db/model), reescrevendo para o caminho real
    // antes do Docsify inicializar (inicialização ocorre no DOMContentLoaded).
    (function () {
      var base = window.__DOCS_BASE__;
      if (window.location.hash.indexOf('#/') === 0) {
        window.history.replaceState(null, null, base + window.location.hash.slice(2));
      }
      var q = new URLSearchParams(window.location.search);
      if (q.has('p')) {
        var p = q.get('p');
        window.history.replaceState(null, null, base + p.replace(/^\//, ''));
      }
    })();
  </script>
  <script src="//unpkg.com/prismjs/components/prism-php.min.js"></script>
  <script src="//unpkg.com/docsify-edit-on-github/index.js"></script>
  <script src="//unpkg.com/mermaid@9/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false });

    // Base do site: /hyperf-doc-pt/3.2/ no GitHub Pages, /3.2/ localmente
    var basePath = window.__DOCS_BASE__ || window.location.pathname.replace(/index\.html.*$/, '');
    var rootLink = basePath.replace(/3\.2\/$/, '');

    window.$docsify = {
      name: 'Hyperf 3.2 (pt-BR)',
      nameLink: rootLink,
      repo: 'L4ZARIN3/hyperf-doc-pt',
      homepage: 'README.md',
      loadSidebar: 'summary.md',
      routerMode: 'history',
      basePath: basePath,
      themeColor: '#3F51B5',
      logo: 'logo.png',
      auto2top: true,
      subMaxLevel: 4,
      topMargin: 20,
      search: {
        depth: 6,
        noData: 'Nenhum resultado encontrado!',
        paths: 'auto',
        placeholder: 'Digite para pesquisar'
      },
      plugins: [
        EditOnGithubPlugin.create('https://github.com/L4ZARIN3/hyperf-doc-pt/blob/main/3.2/', null, 'Editar no GitHub'),
      ],
      plantuml: {
        skin: 'classic',
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              return ('<div class="mermaid">' + mermaid.render(lang, code) + '</div>');
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      }
    }
  </script>
  <script src="//unpkg.com/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="//unpkg.com/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//unpkg.com/docsify-plantuml/dist/docsify-plantuml.min.js"></script>
  <script src="//unpkg.com/docsify@4/lib/plugins/zoom-image.min.js"></script>
</body>

</html>
